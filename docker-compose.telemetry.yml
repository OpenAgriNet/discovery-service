# The telemetry overlay: a collector, plus the settings that make the service
# export to it.
#
#   docker compose -f docker-compose.yml -f docker-compose.telemetry.yml \
#     --profile app up -d --build
#
# or `make telemetry`, which is the same command.
#
# An OVERLAY rather than a third profile, because it has to change the
# discovery-service container's environment and a profile can only add
# containers. Keeping it in a second file also keeps the default stack honest:
# `otel.exporter` stays `none` in config/common.yaml, so the collector-less
# boot that T2 pins is still what you get by default and is still tested.

services:
  otel-collector:
    # contrib, not core: `spanmetrics` is a contrib connector and the core
    # distribution does not carry it.
    #
    # Pinned rather than :latest on purpose. The connector's default stream
    # names have been renamed across releases, and this config depends on the
    # names — a floating tag turns that into a dashboard that breaks on a pull
    # at a time nobody chose.
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # The scrape endpoint, and the one worth having on the host: this is
      # where the derived metrics appear.
      #   curl -s localhost:8889/metrics | grep discovery_calls_total
      - "8889:8889"
      # OTLP/gRPC. Published so the binary can be run from the host against
      # this collector — the day-to-day loop this repo is set up for, where the
      # service runs outside Compose and only its dependencies run inside.
      - "4317:4317"

  discovery-service:
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        # Started, not healthy. The OTLP gRPC client is lazy — it dials on the
        # first export, not at construction — so the service boots fine against
        # a collector that is not up yet, and requiring otherwise would add a
        # startup dependency the design specifically avoids.
        condition: service_started
    environment:
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

      # Both are required once the exporter is otlp, and the boot refuses
      # without them (config.go:568-593) — which is correct rather than
      # inconvenient: `producer` is the Resource attribute saying which
      # participant produced the stream, and a stream attributed to no
      # participant is not worth exporting.
      #
      # An FQDN because that is what a registered subscriber id is. This one is
      # local and registered nowhere.
      APP_SUBSCRIBER_ID: discovery-service.local-network.oan

      # Must be a sector this build declares, and `Agriculture` is the only one
      # (fact.ResourceDomain). Every OAN component has to emit the identical
      # string or grouping splits across the network, so a typo fails the boot
      # rather than quietly producing a second group of one.
      APP_DOMAIN: Agriculture
