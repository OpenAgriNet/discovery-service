# docker compose up -d --wait                 PostgreSQL alone (make up)
# docker compose --profile app up -d           plus the service (make run)
# OTEL_EXPORTER=otlp docker compose \          plus a collector (make telemetry)
#   --profile app --profile telemetry up -d

services:
  postgres:
    # Pinned, not :pg16 — the HNSW options this service uses arrived in 0.8.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery -d discovery"]
      interval: 2s
      timeout: 3s
      retries: 30

  discovery-service:
    profiles: ["app"]
    build:
      context: .
      # The build stamp, from the shell rather than from git: the build context
      # has no .git and the toolchain therefore writes no vcs.* settings, so a
      # compose-built image reports dev/unknown/epoch unless something crosses
      # them. Compose cannot shell out, so these read the environment — `make
      # compose-up` exports them, and a bare `docker compose build` gets the
      # Dockerfile's defaults and honestly says it does not know.
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
        TREE_STATE: ${TREE_STATE:-}
    ports:
      - "8080:8080"
    # No depends_on for otel-collector: the OTLP client dials on first export,
    # and a dependency on a disabled profile has nothing to resolve to.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local credentials, not secrets. A deployment overrides DATABASE_URL
      # from the environment, which is why it is in neither YAML file.
      DATABASE_URL: postgres://discovery:discovery@postgres:5432/discovery?sslmode=disable
      # Migrations are compiled into the binary and applied on boot.
      DATABASE_AUTO_MIGRATE: "true"
      # Required; fills an empty publishDirectives.visibleTo.
      APP_NETWORK_ID: local-network
      LOG_LEVEL: debug
      # Effectively off. The real default (20/40, A4) trips on any scripted
      # sweep, and a 429 NACK carries no `catalogs`. Not zero: burst >= rps > 0.
      RATE_LIMIT_RPS: "100000"
      RATE_LIMIT_BURST: "100000"
      # The telemetry switch, and the only environment change the old
      # docker-compose.telemetry.yml overlay carried.
      OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
      # Read only when the exporter is otlp, so set unconditionally.
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      APP_SUBSCRIBER_ID: discovery-service.local-network.oan
      # Overridable, because the domain gate is a thing people test AGAINST: a
      # request carrying domain "Energy" is supposed to be refused, and a hard
      # `Agriculture` here fights that developer silently, from a file they have
      # no reason to be reading.
      APP_DOMAIN: ${APP_DOMAIN:-Agriculture}
    volumes:
      # The Beckn spec, which the service refuses to boot without. Mounting the
      # cache is what makes the stack work with no network; the boot logs one
      # accurate warning about the fetch it skipped. Byte-identical to the
      # core-v2.0.0-lts tag of beckn/protocol-specifications-v2 — set
      # VALIDATION_SPEC_URL to that raw URL to exercise the fetch path.
      - ./tests/testdata/beckn-v2.0.0.yaml:/app/.cache/beckn/beckn.yaml:ro
    # No healthcheck: the distroless runtime has no shell to run one. Probes are
    # HTTP — GET /healthz for liveness, GET /readyz for PostgreSQL.

  otel-collector:
    profiles: ["telemetry"]
    # contrib, not core: `spanmetrics` is a contrib connector. Pinned because
    # its default stream names have been renamed across releases.
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "8889:8889" # scrape endpoint — the derived metrics
      - "4317:4317" # OTLP/gRPC, published so the binary can run from the host

volumes:
  postgres-data:
