# Pull-and-run stack. No Go toolchain, no local build, no `git clone` even —
# this file alone is enough. It only pulls the prebuilt discovery-service
# image from GHCR.
#
#   docker compose up -d
#   curl localhost:8080/healthz
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery -d discovery"]
      interval: 2s
      timeout: 3s
      retries: 30

  discovery-service:
    image: ghcr.io/nisargabd/discovery-service:${TAG:-latest}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://discovery:discovery@postgres:5432/discovery?sslmode=disable
      DATABASE_AUTO_MIGRATE: "true"
      APP_NETWORK_ID: local-network
      LOG_LEVEL: info
      # The service loads the Beckn spec before it serves and refuses to boot
      # without it. Fetched here rather than mounted, since this folder has
      # no repo checkout to mount a cached copy from — needs network egress.
      VALIDATION_SPEC_URL: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/main/api/v2.0.0/beckn.yaml

volumes:
  postgres-data:
