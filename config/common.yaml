# Reviewed repository defaults — layer two of four. Lowest first:
#
#   envDefault struct tags  →  config/common.yaml  →  config/instance.yaml
#                           →  process environment
#
# Only settings this project has actually decided a value for belong here. A
# key that matches no Config field fails startup, so a typo cannot silently do
# nothing; by the same token, a value nobody has chosen is better left to the
# struct tag than invented here.
#
# Secrets — DATABASE_URL above all — never appear in this file or in
# instance.yaml. That is why the environment sits on top of both (TRD §8).

app:
  # Validated with time.LoadLocation at startup: a typo must fail the boot
  # rather than silently shift every daily validity window.
  defaultTimezone: Asia/Kolkata

search:
  maxRadiusMeters: 200000
  # The two page bounds. defaultPageSize is what a request naming no limit
  # gets; maxPageSize is the ceiling a larger limit is clamped to.
  defaultPageSize: 20
  maxPageSize: 100
  # How many ids one retrieval mode may return into fusion. Not a page size —
  # it is also the reachable pagination depth, so it is this number over
  # maxPageSize that says how many pages deep a caller may go.
  maxCandidatesPerMode: 500
  # A missing retrieval mode degrades and is named in X-Beckn-Degraded (C11).
  # true turns the same request into a 400. Phase 1 ships with the semantic
  # mode absent by design, so refusing would break the common case.
  failOnUnavailableMode: false

embeddings:
  # Semantic search is deferred (A5). The column, the HNSW index and the
  # Embedder seam all ship; the provider does not.
  provider: noop

validation:
  enableL1Schema: true
  # L2 extended validation was skipped by decision, not blocked: nothing reads
  # this flag, so `true` refuses the boot the way an enabled-but-absent
  # signature check does. C4 therefore has no enforcer today — see the plan's
  # Deferred table.
  enableL2Context: false

auth:
  # Phase 2, and parked further than that: the Ed25519 primitives are not built
  # and the Signature middleware is not written, so nothing sits behind this
  # flag. true therefore refuses the boot rather than reporting a security
  # control that is not running. Only the slot in the middleware order ships.
  enableSignatureVerification: false

otel:
  # A collector-less deploy still boots (T2).
  exporter: none
