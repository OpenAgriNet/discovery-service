openapi: 3.0.3
info:
  title: OpenAgriNet API Specification
  version: 1.0.0
  description: |-
    Two surfaces, one network. **Discovery** publishes resources and searches them; the
    **registry** says who is on the network and how to call them.

    They are separate services on separate hosts. Every path carries its own
    `servers`, so the host is unambiguous per operation.

    | surface | host | auth | tags |
    |---|---|---|---|
    | Discovery | `discovery-network-vistaar.da.gov.in` | handled by the adapter in front | Publish, Discover |
    | Registry | `registry-network-vistaar.da.gov.in` | bearer | SchemaRegistry, Participant, ProviderSchema |

    Discovery follows Beckn v2.0.0; see `beckn.yaml` for the protocol and for the
    authoritative shape of `Catalog`, `Provider`, `Resource` and `Offer`, which are
    declared permissively here. Outcomes are returned as the 200 body.

    The registry is three tables:

    | table | what it holds |
    |---|---|
    | `SchemaRegistry` | The kinds of data the network knows about — OpenAgriNet's network-spec metadata. One row per capability: what a weather observation or a mandi price is, and where its schema lives. |
    | `Participant` | Everyone the network deals with — consumer nodes, the network node, provider nodes, and the external provider APIs behind them. One row each. |
    | `ProviderSchema` | How to call each provider for each capability. A participant can offer several capabilities, so it gets one row per capability — the table is a one-to-many map from participant to capability. |

    Its REST surface is generated by Sunbird RC from the JSON Schema files
    in `docs/registry/schemas/`, which are the contract. Three things to know:
    bodies are wrapped one level under the entity name (`{"Participant": {...}}`);
    `osid` is RC's row id, returned by the create, so an update has to `/search`
    first to find it; and `PUT` replaces rather than merges, so an omitted field is
    deleted — read the record, edit what you read, send it all back.
servers:
  - &id001
    url: https://discovery-network-vistaar.da.gov.in
    description: Bharat Vistaar network node — publish and discover
  - &id002
    url: https://registry-network-vistaar.da.gov.in
    description: Bharat Vistaar registry
tags:
  - name: Publish
    description: Providers submit resources for indexing.
  - name: Discover
    description: Consumers search the published resources.
  - name: SchemaRegistry
    description: The kinds of data the network knows about — weather, mandi price, schemes.
  - name: Participant
    description:
      Everyone on the network — consumer, network and provider nodes, plus the external provider
      APIs behind them.
  - name: ProviderSchema
    description: How to call each provider for each capability it offers.
x-tagGroups:
  - name: Discovery API Specification
    tags:
      - Publish
      - Discover
  - name: Registry API Specification
    tags:
      - SchemaRegistry
      - Participant
      - ProviderSchema
paths:
  /publish:
    post:
      tags:
        - Publish
      operationId: publish
      summary: Publish or update resources
      description: |-
        Submits resources — the things a farmer can be shown. On the wire they travel grouped
        into one or more catalogs: a catalog is the unit of submission and of verdict, and the
        resources inside it are what `/discover` later matches on.

        Each catalog is processed independently and gets its own verdict — `ACCEPTED`, `REJECTED`
        or `PARTIAL` — in the 200 body. A `PARTIAL` means it landed with some of its resources
        dropped; the `errors` array says which and why.

        Phase 1 accepts regular resources only. A directive naming `catalogType: MASTER`, or a
        resource carrying `extends`, is rejected with `SCH_TYPE_NOT_SUPPORTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
            examples:
              weatherForecast:
                summary: One weather resource, MERGE, scoped to two networks
                value:
                  context:
                    action: publish
                    version: 2.0.0
                    messageId: 1c0a55d7-8e64-4b19-9a2f-33b7c6e1d905
                    transactionId: 9f2c1a8e-4b70-4d31-9c55-6f2e0b1d7a44
                    timestamp: "2026-08-26T06:11:58.004Z"
                    networkId: da.gov.in/vistaar
                  message:
                    catalogs:
                      - id: cat:mausamgram:weather
                        isActive: true
                        provider:
                          id: mausamgram
                          descriptor:
                            code: IMD-NWP-01
                            name: IMD Mausamgram NWP
                          availableAt:
                            - geo:
                                type: Polygon
                                coordinates:
                                  - - - 68.1
                                      - 8.0
                                    - - 97.4
                                      - 8.0
                                    - - 97.4
                                      - 37.1
                                    - - 68.1
                                      - 37.1
                                    - - 68.1
                                      - 8.0
                        validity:
                          startDate: "2026-01-01T00:00:00Z"
                          endDate: "2026-03-31T23:59:59Z"
                        resources:
                          - id: res:mausamgram:point-forecast
                            descriptor:
                              name: Five-day point forecast
                            resourceAttributes:
                              "@context": https://schemas.openagrinet.global/schema/WeatherObservation/v0.1/context.jsonld
                              "@type": openagrinet:WeatherObservation
                              informationMode: OnDemand
                              supportedObservationTypes:
                                - Forecast
                              supportedParameters:
                                - Rainfall
                                - Temperature
                                - Humidity
                                - WindSpeed
                                - WindDirection
                              geographicGranularity:
                                - Point
                              forecastHorizon: P5D
                              updateFrequency: PT12H
                              subjectCategories:
                                - Weather
                    publishDirectives:
                      - catalogId: cat:mausamgram:weather
                        catalogType: REGULAR
                        updateMode: MERGE
                        visibleTo:
                          - da.gov.in/vistaar
                          - oan
      responses:
        "200":
          description: |
            ACK. Per-catalog verdicts in the body. A 200 does **not** mean every catalog
            was accepted — read `message.results[].status`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Response-Time:
              $ref: "#/components/headers/XResponseTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnPublishResponse"
              examples:
                mixed:
                  summary: One accepted, one rejected, one partial
                  value:
                    context:
                      action: catalog/on_publish
                      version: 2.0.0
                      messageId: 1c0a55d7-8e64-4b19-9a2f-33b7c6e1d905
                      transactionId: 9f2c1a8e-4b70-4d31-9c55-6f2e0b1d7a44
                      timestamp: "2026-08-26T06:11:58.612Z"
                    message:
                      results:
                        - catalogId: cat:mausamgram:weather
                          status: ACCEPTED
                          stats:
                            itemCount: 1
                            providerCount: 1
                            categoryCount: 1
                        - catalogId: cat-2
                          status: REJECTED
                          errors:
                            - code: SCH_TYPE_NOT_SUPPORTED
                              message: master catalogs are out of scope in phase 1
                              details:
                                path: $.message.publishDirectives[1]
                        - catalogId: cat-3
                          status: PARTIAL
                          stats:
                            itemCount: 8
                            providerCount: 1
                            categoryCount: 1
                          errors:
                            - code: SCH_INVALID_FORMAT
                              message: geometry could not be read
                              details:
                                path: $.message.catalogs[2]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    servers:
      - *id001
  /discover:
    post:
      tags:
        - Discover
      operationId: discover
      summary: Search the network for resources
      description: |-
        Matches published resources against an intent and returns those that match, in the
        catalogs that carry them, in the 200 body. Answered from the local index; this route
        never calls providers or upstream APIs.

        `context.networkId` applies no network predicate here — every network's resources are
        eligible. On `/publish` the same field fills an empty `visibleTo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverRequest"
            examples:
              rainNearNashik:
                summary: Weather observations within 250 km of Nashik
                value:
                  context:
                    action: discover
                    version: 2.0.0
                    messageId: 1c0a55d7-8e64-4b19-9a2f-33b7c6e1d905
                    transactionId: 9f2c1a8e-4b70-4d31-9c55-6f2e0b1d7a44
                    timestamp: "2026-08-26T06:11:58.004Z"
                    schemaContext:
                      - https://schemas.openagrinet.global/schema/WeatherObservation/v0.1/context.jsonld#openagrinet:WeatherObservation
                  message:
                    intent:
                      textSearch: weather forecast rain next five days
                      filters:
                        type: jsonpath
                        expression: $.catalogs[*].resources[*] ? (@.resourceAttributes."@type" == "openagrinet:WeatherObservation")
                      spatial:
                        - op: S_DWITHIN
                          targets: $.catalogs[*].provider.availableAt[*].geo
                          geometry:
                            type: Point
                            coordinates:
                              - 73.7898
                              - 19.9975
                          distanceMeters: 250000
                          quantifier: ANY
                          srid: EPSG:4326
      responses:
        "200":
          description: |-
            ACK. The matching resources, in the `catalogs` array that carries them. An empty array
            is an honest "nothing matched", not a failure.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Response-Time:
              $ref: "#/components/headers/XResponseTime"
            X-Beckn-Degraded:
              $ref: "#/components/headers/XBecknDegraded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnDiscoverResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    servers:
      - *id001
  /api/v1/SchemaRegistry:
    post:
      tags:
        - SchemaRegistry
      operationId: createSchemaRegistry
      summary: Create a capability
      description: |-
        Creates a capability. RC's unique index is a single field, so re-creating an existing
        `capabilityCode` overwrites it rather than returning a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaRegistryWrapper"
            example:
              SchemaRegistry:
                capabilityCode: openagrinet:WeatherObservation
                name: Weather Observation and Forecast
                version: v0.1
                schemaUrl: https://raw.githubusercontent.com/OpenAgriNet/network-specs/main/schema/WeatherObservation/v0.1/attributes.yaml
                status: active
      responses:
        "200":
          $ref: "#/components/responses/CreateOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/SchemaRegistry/search:
    post:
      tags:
        - SchemaRegistry
      operationId: searchSchemaRegistry
      summary: Look up capabilities by indexed field
      description: "Filterable fields: `capabilityCode` (unique), `status`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              filters:
                capabilityCode:
                  eq: openagrinet:WeatherObservation
                status:
                  eq: active
      responses:
        "200":
          $ref: "#/components/responses/SearchOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/SchemaRegistry/{osid}:
    parameters:
      - $ref: "#/components/parameters/Osid"
    get:
      tags:
        - SchemaRegistry
      operationId: readSchemaRegistry
      summary: Read one capability
      responses:
        "200":
          $ref: "#/components/responses/ReadOk"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
      security:
        - bearerAuth: []
    put:
      tags:
        - SchemaRegistry
      operationId: replaceSchemaRegistry
      summary: Replace a capability in full
      description: Replaces, does not merge. An omitted field is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaRegistryWrapper"
      responses:
        "200":
          $ref: "#/components/responses/UpdateOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/Participant:
    post:
      tags:
        - Participant
      operationId: createParticipant
      summary: Create a node or an upstream
      description: |-
        `type` decides which of the remaining fields apply. A node needs `role` and `keys` and a
        hostname `participantId`; an upstream is refused both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantWrapper"
            examples:
              node:
                summary: A provider node — speaks Beckn, so it has a role and a key
                value:
                  Participant:
                    participantId: provider-network-vistaar.da.gov.in
                    name: OpenAgriNet provider adapter
                    type: node
                    status: active
                    baseUrl: https://provider-network-vistaar.da.gov.in/beckn
                    role: BPP
                    keys:
                      keyId: k1
                      use: sign
                      alg: ed25519
                      key: base64:xq4+2oQ6MgSZdHHBMtNd1TmnPTmzY5UoZlqzf0yn6ZA=
                      validFrom: "2026-08-01T00:00:00Z"
                      validUntil: "2026-11-01T00:00:00Z"
                      status: active
              upstream:
                summary: An upstream API — has not heard of Beckn, so no role and no keys
                value:
                  Participant:
                    participantId: mausamgram
                    name: IMD Mausamgram NWP
                    type: upstream
                    status: active
                    baseUrl: https://mausamgram.imd.gov.in
      responses:
        "200":
          $ref: "#/components/responses/CreateOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/Participant/search:
    post:
      tags:
        - Participant
      operationId: searchParticipant
      summary: Look up participants by indexed field
      description: |-
        Filterable fields: `participantId` (unique), `status`, `type`, `baseUrl`. RC filters on
        top-level fields only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              filters:
                type:
                  eq: upstream
                status:
                  eq: active
      responses:
        "200":
          $ref: "#/components/responses/SearchOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/Participant/{osid}:
    parameters:
      - $ref: "#/components/parameters/Osid"
    get:
      tags:
        - Participant
      operationId: readParticipant
      summary: Read one participant
      responses:
        "200":
          $ref: "#/components/responses/ReadOk"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
      security:
        - bearerAuth: []
    put:
      tags:
        - Participant
      operationId: replaceParticipant
      summary: Replace a participant in full — also how you suspend or rotate
      description: |-
        Replaces a participant in full. Flip `status` to `inactive` to suspend. Rotating a node's
        key is such a `PUT`: the `keys` object is replaced, and verifiers pick it up on their next
        reload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantWrapper"
            example:
              Participant:
                participantId: agmarknet
                name: Agmarknet Vistaar (Directorate of Marketing & Inspection)
                type: upstream
                status: inactive
                baseUrl: https://api.agmarknet.gov.in
      responses:
        "200":
          $ref: "#/components/responses/UpdateOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/ProviderSchema:
    post:
      tags:
        - ProviderSchema
      operationId: createProviderSchema
      summary: Create a binding
      description: |-
        One row is one provider and one capability. A provider serving two capabilities is one
        `Participant` and two `ProviderSchema` rows. What varies per Beckn action varies inside
        `actions[]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSchemaWrapper"
            examples:
              oneAction:
                summary: One capability, one action
                value:
                  ProviderSchema:
                    bindingKey: mausamgram|openagrinet:WeatherObservation
                    participantId: mausamgram
                    capabilityCode: openagrinet:WeatherObservation
                    status: active
                    actions:
                      - action: select
                        method: GET
                        path: /nwpapi/get-daily
                        mappings: mappings/mausamgram/weather-observation.select.yaml
                        timeoutMs: 30000
                        retryMax: 3
                        status: active
              twoActions:
                summary: Two actions on one capability, different endpoints and timeouts
                value:
                  ProviderSchema:
                    bindingKey: agmarknet|openagrinet:MandiPrice
                    participantId: agmarknet
                    capabilityCode: openagrinet:MandiPrice
                    status: active
                    actions:
                      - action: select
                        method: GET
                        path: /v1/fetch-agmarknet-vistaar-location
                        mappings: mappings/agmarknet/mandi-price.select.yaml
                        timeoutMs: 20000
                        retryMax: 2
                        status: active
                      - action: confirm
                        method: POST
                        path: /v1/alerts/subscribe
                        mappings: mappings/agmarknet/mandi-price.confirm.yaml
                        timeoutMs: 5000
                        status: inactive
      responses:
        "200":
          $ref: "#/components/responses/CreateOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/ProviderSchema/search:
    post:
      tags:
        - ProviderSchema
      operationId: searchProviderSchema
      summary: Look up bindings by indexed field
      description: |-
        Filterable fields: `bindingKey` (unique), `participantId`, `capabilityCode`, `status`.
        This is the read the adapter does at boot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              filters:
                bindingKey:
                  eq: mausamgram|openagrinet:WeatherObservation
                status:
                  eq: active
      responses:
        "200":
          $ref: "#/components/responses/SearchOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
      security:
        - bearerAuth: []
    servers:
      - *id002
  /api/v1/ProviderSchema/{osid}:
    parameters:
      - $ref: "#/components/parameters/Osid"
    get:
      tags:
        - ProviderSchema
      operationId: readProviderSchema
      summary: Read one binding
      responses:
        "200":
          $ref: "#/components/responses/ReadOk"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
      security:
        - bearerAuth: []
    put:
      tags:
        - ProviderSchema
      operationId: replaceProviderSchema
      summary: Replace a binding in full
      description: |-
        Replaces a binding in full. Changing one action's timeout means sending the whole
        `actions` array back; an omitted entry is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSchemaWrapper"
      responses:
        "200":
          $ref: "#/components/responses/UpdateOk"
        "400":
          $ref: "#/components/responses/RegistryBadRequest"
        "401":
          $ref: "#/components/responses/RegistryUnauthorized"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
      security:
        - bearerAuth: []
    servers:
      - *id002
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Bearer token. `_osConfig.roles` gates the entity rather than the verb, so a token that
        can read these records can also write them.
  parameters:
    Osid:
      name: osid
      in: path
      required: true
      description: RC's row id, returned by the create. Not `participantId`, not `bindingKey`.
      schema:
        type: string
        example: 1-8f2c4e7a-3b91-4d0e-9c55-2a1f6b8e0d34
  headers:
    XRequestId:
      description: |
        Echoed from the request's `X-Request-Id` when the caller sent one, otherwise
        minted here. Honouring the caller's value is what lets one caller correlate a
        request across their logs and ours.
      schema:
        type: string
    XResponseTime:
      description: Server-side handling time.
      schema:
        type: string
        example: 12ms
    XBecknErrorType:
      description: |-
        The fault category — `context`, `core`, `domain`, `policy`, `system`. Travels as a header;
        `ERROR_INCLUDE_LEGACY_TYPE=true` also writes it into the body as `error.type` for
        v1-style clients. Defaults to false.
      schema:
        type: string
        enum:
          - context
          - core
          - domain
          - policy
          - system
    XBecknDegraded:
      description: |-
        Comma-separated retrieval modes that were unavailable for this request, when the answer
        was served without them.
      schema:
        type: string
        example: semantic
    RetryAfter:
      description: Seconds to wait before retrying, computed by the limiter.
      schema:
        type: integer
        example: 3
  responses:
    BadRequest:
      description: |-
        NACK. The request is malformed or refused on content: every `CTX_` and `SCH_` code, the
        `BIZ_` family, and `NET_CATALOG_SOURCE_UNAVAILABLE`. Retrying does not help.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Beckn-Error-Type:
          $ref: "#/components/headers/XBecknErrorType"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Nack"
          examples:
            badJsonPath:
              summary: An RFC 9535 filter expression, which is not executed
              value:
                message:
                  status: NACK
                  messageId: 1c0a55d7-8e64-4b19-9a2f-33b7c6e1d905
                  error:
                    code: SCH_INVALID_JSONPATH
                    message: RFC 9535 syntax is not executed; use PostgreSQL SQL/JSON path with a ? predicate
                    details:
                      path: $.message.intent.filters.expression
    Unauthorized:
      description: |-
        NACK. The `AUT_` family, minus the rate limiter. Signature verification runs in the
        adapter in front of this service, not here.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Beckn-Error-Type:
          $ref: "#/components/headers/XBecknErrorType"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Nack"
    Forbidden:
      description: NACK. The `POL_` family, except the oversized-body case which is a 413.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Beckn-Error-Type:
          $ref: "#/components/headers/XBecknErrorType"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Nack"
    PayloadTooLarge:
      description: NACK, `POL_NP_CAPACITY_EXCEEDED` — the body exceeded `SERVER_MAX_REQUEST_BODY_BYTES`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Beckn-Error-Type:
          $ref: "#/components/headers/XBecknErrorType"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Nack"
    RateLimited:
      description: NACK, `AUT_RATE_LIMITED`. The credentials were fine; the pace was not.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Beckn-Error-Type:
          $ref: "#/components/headers/XBecknErrorType"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Nack"
    ServerError:
      description: NACK, the `NET_` family. The message is generic; the original goes to the log.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Beckn-Error-Type:
          $ref: "#/components/headers/XBecknErrorType"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Nack"
    CreateOk:
      description: |-
        Created. Response shapes for the registry are illustrative — the request shapes are
        corroborated, RC's exact envelope is not.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RCResponse"
          example:
            id: sunbird-rc.registry.create
            params:
              status: SUCCESSFUL
            result:
              Participant:
                osid: 1-8f2c4e7a-3b91-4d0e-9c55-2a1f6b8e0d34
    UpdateOk:
      description: Replaced. Shape illustrative — see CreateOk.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RCResponse"
          example:
            id: sunbird-rc.registry.update
            params:
              status: SUCCESSFUL
            result:
              Participant:
                osid: 1-8f2c4e7a-3b91-4d0e-9c55-2a1f6b8e0d34
    ReadOk:
      description: The record. Shape illustrative — see CreateOk.
      content:
        application/json:
          schema:
            type: object
    SearchOk:
      description: |-
        Matching rows, each carrying `osid` and the system fields `osCreatedAt`, `osUpdatedAt`,
        `osCreatedBy`, `osUpdatedBy`. Shape illustrative — see CreateOk.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    RegistryBadRequest:
      description: The body failed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RCResponse"
    RegistryUnauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RCResponse"
    RegistryNotFound:
      description: No record with that `osid`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RCResponse"
  schemas:
    Context:
      type: object
      description: |-
        The Beckn envelope header. A response echoes `transactionId`, `messageId` and the rest;
        only `action` changes and `timestamp` advances.
      properties:
        action:
          type: string
          description: |-
            Both publish spellings are accepted on `POST /publish` — the schema index is keyed by
            action rather than by URL.
          enum:
            - publish
            - catalog/publish
            - discover
            - catalog/on_publish
            - on_discover
        version:
          type: string
          const: 2.0.0
          description: The one protocol version this build serves.
        senderId:
          type: string
          description: |-
            A DID resolving to the document carrying the sender's verification keys. Not verified at
            this layer.
        receiverId:
          type: string
          description: See `senderId`. Also unverified.
        transactionId:
          type: string
          format: uuid
          description: UUID v4. Constant across every hop of one farmer question.
        messageId:
          type: string
          format: uuid
          description: UUID v4. New per request; echoed on the response and on a NACK.
        timestamp:
          type: string
          format: date-time
          description: |
            RFC 3339, carried as a string rather than a typed time so a bad value can come
            back as a fault naming `$.context.timestamp` instead of failing the whole decode.
        networkId:
          type: string
          description: |-
            The subnet this request belongs to. On `/discover` it applies **no predicate at all** —
            every network's resources match. On `/publish` it fills an empty `visibleTo`.
          example: da.gov.in/vistaar
        schemaContext:
          type: array
          items:
            type: string
            format: uri
          description: |
            JSON-LD context URIs, each with an optional `#fragment` naming the `@type`. A
            **Context** field, never an Intent one — the reference implementation moved it to
            `message.intent`, which `Intent`'s `additionalProperties: false` forbids outright.
        key:
          type: string
        try:
          type: boolean
        ttl:
          type: string
          description: ISO 8601 duration.
        requestDigest:
          description: Opaque. Passed through.
      additionalProperties: true
    PublishRequest:
      type: object
      required:
        - context
        - message
      properties:
        context:
          $ref: "#/components/schemas/Context"
        message:
          $ref: "#/components/schemas/CatalogPublishAction"
    CatalogPublishAction:
      type: object
      required:
        - catalogs
      properties:
        catalogs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Catalog"
        publishDirectives:
          type: array
          items:
            $ref: "#/components/schemas/PublishDirective"
          description: |-
            Per-catalog processing instructions, matched to a catalog by `catalogId`. Every other
            field has a declared default, so an absent directive and one naming only `catalogId`
            behave identically.
    PublishDirective:
      type: object
      required:
        - catalogId
      properties:
        catalogId:
          type: string
          description: MUST exactly match an `id` in this request's `catalogs` array.
        catalogType:
          type: string
          enum:
            - REGULAR
            - MASTER
          default: REGULAR
          description: |
            **`MASTER` is refused in phase 1** with `SCH_TYPE_NOT_SUPPORTED` — rejected, not
            partially handled.
        updateMode:
          type: string
          enum:
            - MERGE
            - FULL
          default: MERGE
          description: |
            `MERGE` upserts resources by id and retains those this request did not mention.
            `FULL` replaces the catalog. The default matters: `FULL` **deletes** what the
            payload omitted, so an omitted `updateMode` reading as `FULL` would turn every
            directive-less republish into a partial wipe.
        visibleTo:
          type: array
          items:
            type: string
          description: |-
            Restricts this catalog to the listed participant ids. Empty or omitted resolves to the
            request's own `context.networkId`.
        resourceDirectives:
          type: array
          items:
            type: object
          description:
            Links resources to master resources they inherit from. Phase 1 accepts only an
            empty array.
    OnPublishResponse:
      type: object
      required:
        - context
        - message
      properties:
        context:
          $ref: "#/components/schemas/Context"
        message:
          $ref: "#/components/schemas/CatalogOnPublishAction"
    CatalogOnPublishAction:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProcessingResult"
    CatalogProcessingResult:
      type: object
      required:
        - catalogId
        - status
      properties:
        catalogId:
          type: string
        status:
          type: string
          enum:
            - ACCEPTED
            - REJECTED
            - PARTIAL
          description:
            "`PARTIAL` means the catalog landed with something dropped; the `errors` array
            says what."
        stats:
          $ref: "#/components/schemas/CatalogStats"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"
          description: |
            The spec's own array — which is why the publish path never packs faults into a
            `details.cause` chain. A NACK is the only place the chain is used.
    CatalogStats:
      type: object
      properties:
        itemCount:
          type: integer
        providerCount:
          type: integer
        categoryCount:
          type: integer
    DiscoverRequest:
      type: object
      required:
        - context
        - message
      properties:
        context:
          $ref: "#/components/schemas/Context"
        message:
          type: object
          required:
            - intent
          properties:
            intent:
              $ref: "#/components/schemas/Intent"
    OnDiscoverResponse:
      type: object
      required:
        - context
        - message
      properties:
        context:
          $ref: "#/components/schemas/Context"
        message:
          type: object
          required:
            - catalogs
          additionalProperties: false
          description: |-
            Carries `catalogs` and nothing else — the v2.0.0 schema declares
            `additionalProperties: false`. Degraded modes travel in `X-Beckn-Degraded`.
          properties:
            catalogs:
              type: array
              items:
                $ref: "#/components/schemas/Catalog"
    Intent:
      type: object
      additionalProperties: false
      description: Closed. `schemaContext` belongs on Context, not here.
      properties:
        textSearch:
          type: string
          description: Free text. Lexical by default; the semantic path is configuration-gated.
        filters:
          $ref: "#/components/schemas/Filters"
        spatial:
          type: array
          items:
            $ref: "#/components/schemas/SpatialConstraint"
        mediaSearch:
          type: object
          description: Passed through. See beckn.yaml.
    Filters:
      type: object
      required:
        - type
        - expression
      properties:
        type:
          type: string
          enum:
            - jsonpath
        expression:
          type: string
          description: |-
            PostgreSQL SQL/JSON path only, and it must carry a `?` predicate. An RFC 9535 expression
            is rejected with `SCH_INVALID_JSONPATH`.
          example: $.catalogs[*].resources[*] ? (@.resourceAttributes.observationType == "Forecast")
    SpatialConstraint:
      type: object
      required:
        - op
        - targets
      properties:
        op:
          type: string
          enum:
            - S_INTERSECTS
            - S_DISJOINT
            - S_WITHIN
            - S_CONTAINS
            - S_OVERLAPS
            - S_EQUALS
            - S_DWITHIN
            - S_TOUCHES
            - S_CROSSES
          description: |
            `S_TOUCHES` and `S_CROSSES` are legal enum values and pass L1 validation, then are
            **refused** by the intent mapper with `SCH_TYPE_NOT_SUPPORTED` — they are not
            approximable on the H3 cover this service indexes with, and a wrong answer is worse
            than a refusal.
        targets:
          description: JSONPath to the geometry fields this predicate runs against.
          example: $.catalogs[*].provider.availableAt[*].geo
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
        distanceMeters:
          type: number
          description: Required by `S_DWITHIN`, and refused on every other op.
        quantifier:
          type: string
          enum:
            - ANY
            - ALL
          default: ANY
        srid:
          type: string
          default: EPSG:4326
    GeoJSONGeometry:
      type: object
      required:
        - type
      description: |
        GeoJSON. Coordinates are **`[longitude, latitude]`** — the order that silently returns
        the Arabian Sea for a Nashik query if swapped.
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon
            - GeometryCollection
        coordinates: {}
    Catalog:
      type: object
      required:
        - id
      description: |-
        A provider's resources as one publishable unit — the payload of both directions.
        Declared permissively: the service carries these as opaque JSON and validates them at
        the L1 JSON Schema layer. See beckn.yaml for the authoritative shape.
      properties:
        id:
          type: string
        bppId:
          type: string
        bppUri:
          type: string
          format: uri
        descriptor:
          type: object
        provider:
          type: object
        isActive:
          type: boolean
          default: true
          description: Defaulted by the mapper, so an omitted value is not read as `false`.
        validity:
          $ref: "#/components/schemas/Validity"
        resources:
          type: array
          items:
            type: object
            description: |
              A resource. `resourceAttributes` carries the JSON-LD typed payload — `@context`,
              `@type` and the capability's own fields.

              **A resource carrying `extends` is refused in phase 1** with
              `SCH_TYPE_NOT_SUPPORTED`.
        offers:
          type: array
          items:
            type: object
            description: An offer. `addOns` is refused with `SCH_SCHEMA_VALIDATION_FAILED`.
      additionalProperties: true
    Validity:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        startTime:
          type: string
          description: Time with offset, e.g. 09:00:00+05:30
        endTime:
          type: string
    Nack:
      type: object
      required:
        - message
      description: |-
        The rejection body — one shape for 400, 401, 403, 413, 429 and 500. There is no `context`
        key; correlate a NACK by `message.messageId`.
      properties:
        message:
          type: object
          required:
            - status
            - error
          properties:
            status:
              type: string
              const: NACK
            messageId:
              type: string
              description: Echoed from the request.
            error:
              $ref: "#/components/schemas/Error"
    Error:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      description: Closed, and `details` is closed to exactly `path` and `cause`.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: false
          properties:
            path:
              type: string
              description: JSONPath to the offending field.
              example: $.message.intent.filters.expression
            cause:
              allOf:
                - $ref: "#/components/schemas/Error"
              description: |
                **A NACK carrying several faults is one chain, not a list.** The first fault is
                the `Error`; each remaining fault becomes the `details.cause` of the one before.
        type:
          type: string
          enum:
            - context
            - core
            - domain
            - policy
            - system
          description: |-
            Written only when `ERROR_INCLUDE_LEGACY_TYPE=true`, for v1-style clients that require the
            key in the body. Defaults off; the category otherwise travels as `X-Beckn-Error-Type`.
            When on, it is written at every level of the chain.
    ErrorCode:
      type: string
      description: |-
        Every code this service mints is a member of the canonical Beckn `ErrorCode` enum (76
        members across `CTX_`, `NET_`, `AUT_`, `SCH_`, `POL_`, `BIZ_`) — see beckn.yaml for the
        full enum. A `details.cause` relayed from downstream may carry a non-canonical code.

        Listed below are the codes this service mints, with the status each maps to.

        | code | status |
        |---|---|
        | `CTX_ACTION_MISMATCH` | 400 |
        | `CTX_MISSING_FIELD` | 400 |
        | `CTX_INVALID_FIELD` | 400 |
        | `CTX_VERSION_UNSUPPORTED` | 400 |
        | `SCH_INVALID_JSON` | 400 |
        | `SCH_SCHEMA_VALIDATION_FAILED` | 400 |
        | `SCH_INVALID_FORMAT` | 400 |
        | `SCH_INVALID_JSONPATH` | 400 |
        | `SCH_TYPE_NOT_SUPPORTED` | 400 |
        | `BIZ_ITEM_NOT_FOUND` | 400 |
        | `NET_CATALOG_SOURCE_UNAVAILABLE` | 400 |
        | `AUT_SIGNATURE_MISSING` | 401 |
        | `POL_GENERIC_ERROR` | 403 |
        | `POL_NP_CAPACITY_EXCEEDED` | 413 |
        | `AUT_RATE_LIMITED` | 429 |
        | `NET_INTERNAL_ERROR` | 500 |
      enum:
        - CTX_ACTION_MISMATCH
        - CTX_MISSING_FIELD
        - CTX_INVALID_FIELD
        - CTX_VERSION_UNSUPPORTED
        - AUT_SIGNATURE_MISSING
        - AUT_RATE_LIMITED
        - SCH_INVALID_JSON
        - SCH_SCHEMA_VALIDATION_FAILED
        - SCH_INVALID_FORMAT
        - SCH_INVALID_JSONPATH
        - SCH_TYPE_NOT_SUPPORTED
        - POL_NP_CAPACITY_EXCEEDED
        - POL_GENERIC_ERROR
        - BIZ_ITEM_NOT_FOUND
        - NET_CATALOG_SOURCE_UNAVAILABLE
        - NET_INTERNAL_ERROR
    SearchRequest:
      type: object
      required:
        - filters
      description: |
        Only **indexed** fields can be filtered — RC indexes top-level fields only.
      properties:
        filters:
          type: object
          additionalProperties:
            type: object
            properties:
              eq:
                type: string
          example:
            status:
              eq: active
    RCResponse:
      type: object
      description: Sunbird RC's envelope. Illustrative — unverified against the pinned build.
      properties:
        id:
          type: string
          example: sunbird-rc.registry.create
        params:
          type: object
          properties:
            status:
              type: string
              example: SUCCESSFUL
            errmsg:
              type: string
        result:
          type: object
          description: Keyed by entity name, carrying the new or updated `osid`.
    Status:
      type: string
      enum:
        - active
        - inactive
    CapabilityCode:
      type: string
      pattern: ^openagrinet:[A-Z][A-Za-z0-9]*$
      description: |-
        The `openagrinet:` namespace is literal. The abstract base types
        `openagrinet:AgricultureCapability` and `openagrinet:AgricultureResource` are excluded.
      example: openagrinet:WeatherObservation
    SchemaRegistryWrapper:
      type: object
      required:
        - SchemaRegistry
      properties:
        SchemaRegistry:
          $ref: "#/components/schemas/SchemaRegistry"
    SchemaRegistry:
      type: object
      additionalProperties: false
      required:
        - capabilityCode
        - name
        - version
        - schemaUrl
        - status
      description: |-
        One kind of data the network recognises — OpenAgriNet network-spec metadata: the
        capability's code, its version, and where its schema lives. Reference information only;
        nothing in the call path reads it.
      properties:
        capabilityCode:
          $ref: "#/components/schemas/CapabilityCode"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human label.
        version:
          type: string
          pattern: ^v[0-9]+\.[0-9]+$
          description:
            Must match the `vN.N` segment in `schemaUrl` — checked by `verify/records.py`,
            not by RC.
          example: v0.1
        schemaUrl:
          type: string
          maxLength: 2000
          pattern: ^https://raw\.githubusercontent\.com/OpenAgriNet/network-specs/[A-Za-z0-9_-]+/schema/[A-Za-z0-9]+/v[0-9]+\.[0-9]+/[A-Za-z0-9_-]+\.yaml$
          description: |
            The JSON-LD attributes file defining this capability's fields. **Nothing fetches
            it** — resolvability is unverified.
        status:
          $ref: "#/components/schemas/Status"
    ParticipantWrapper:
      type: object
      required:
        - Participant
      properties:
        Participant:
          $ref: "#/components/schemas/Participant"
    Participant:
      type: object
      additionalProperties: false
      required:
        - participantId
        - name
        - type
        - status
        - baseUrl
      description: |-
        One participant on the network. `type` says which kind, and decides which of the
        remaining fields apply.

        A **node** speaks Beckn — a consumer node, the network node, or a provider node. It needs
        a `role` and `keys`, and its `participantId` must be a hostname, because that id is how
        the network addresses it.

        An **upstream** is an external provider's ordinary HTTP API. It has never heard of Beckn,
        so it has no role and no keys, and its `participantId` is the provider id consumers see.

        An external API and the node that fronts it are two separate participants, so two rows.
      properties:
        participantId:
          type: string
          maxLength: 253
          pattern: ^[a-z0-9][a-z0-9._:-]{2,252}$
          description: |
            Stable id, and the only id. For a `node` this is additionally constrained to a
            hostname — so `oan-provider` is refused there and
            `provider-network-vistaar.da.gov.in` is not.
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum:
            - node
            - upstream
        status:
          $ref: "#/components/schemas/Status"
        baseUrl:
          type: string
          maxLength: 2000
          pattern: ^https?://(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9.:-]*(/[A-Za-z0-9._~%-]+)*$
          description: |-
            The base something is appended to: a Beckn action for a node, a binding's `path` for an
            upstream. Stops at the host. Must be `https` for a node; an upstream may be plaintext.
        role:
          type: string
          enum:
            - BAP
            - BPP
            - NETWORK
          description: |-
            Required for a `node`, refused for an `upstream`. `BAP` asks; `BPP` answers; `NETWORK`
            exposes publish and discover.
        keys:
          allOf:
            - $ref: "#/components/schemas/PublicKey"
          description: Required for a `node`, **refused** for an `upstream`.
    PublicKey:
      type: object
      additionalProperties: false
      required:
        - keyId
        - use
        - alg
        - key
        - validFrom
        - status
      description: |-
        A node's public key. One key, not a list — a node holds a signing key or an encryption
        key, and rotation is a full replace.
      properties:
        keyId:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          description: |
            Field 2 of the `Authorization` keyId, so a sender can say which key it signed with.
            One name out of one — which is what makes the field survivable if a second key is
            ever needed.
        use:
          type: string
          enum:
            - sign
            - encrypt
        alg:
          type: string
          enum:
            - ed25519
            - x25519
          description:
            "Fixed by `use`: `sign` → `ed25519`, `encrypt` → `x25519`. Both curves are 32-byte
            keys."
        key:
          type: string
          pattern: ^base64:[A-Za-z0-9+/]{43}=$
          description:
            base64 of the 32 raw bytes — 44 chars, one trailing `=`. A truncated or wrong-curve
            key fails at write time.
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          description: |
            Absent means open-ended. There is one key, so it has no successor to overlap with:
            a `validUntil` in the past leaves the node unable to sign. This date is a deadline.
        status:
          type: string
          enum:
            - active
            - revoked
          description: "`revoked` withdraws the key early — effective only once the reader refreshes."
    ProviderSchemaWrapper:
      type: object
      required:
        - ProviderSchema
      properties:
        ProviderSchema:
          $ref: "#/components/schemas/ProviderSchema"
    ProviderSchema:
      type: object
      additionalProperties: false
      required:
        - bindingKey
        - participantId
        - capabilityCode
        - status
        - actions
      description: |-
        How to call one provider for one capability.

        A participant can offer several capabilities, and gets one row for each — so this table
        is a one-to-many map from participant to capability, while any single row is one
        participant and one capability.

        `Participant` holds what is true of a provider whatever you ask it for, such as its host.
        This holds what changes per capability: the method, the path, the mapping file and the
        timeouts. Move the host and you edit one field, not every row.
      properties:
        bindingKey:
          type: string
          pattern: ^[a-z0-9][a-z0-9._:-]{2,63}\|openagrinet:[A-Z][A-Za-z0-9]*$
          description:
            "`<participantId>|<capabilityCode>`. The unique key, and the one the adapter resolves
            on."
          example: mausamgram|openagrinet:WeatherObservation
        participantId:
          type: string
          maxLength: 253
          pattern: ^[a-z0-9][a-z0-9._:-]{2,252}$
          description: |
            An `active` upstream `Participant`. **Read from here, never from the request** — a
            configured registry URL is trusted; a URL from a request body is not.
        capabilityCode:
          $ref: "#/components/schemas/CapabilityCode"
        status:
          allOf:
            - $ref: "#/components/schemas/Status"
          description: Retires the whole binding.
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/ActionBinding"
          description: |-
            One entry per Beckn action. Note that JSON Schema cannot pin one-entry-per-action, so a
            row with two `select` entries validates here; `verify/records.py` enforces it.
    ActionBinding:
      type: object
      additionalProperties: false
      required:
        - action
        - method
        - path
        - mappings
        - status
      description: "How to call this provider for one Beckn action: where, how, and with which mapping."
      properties:
        action:
          type: string
          enum:
            - discover
            - select
            - init
            - confirm
            - status
            - track
            - cancel
            - update
            - rate
            - support
          description: |-
            A Beckn request action. An `on_*` callback is not one — `on_select` is the response half
            of the `select` entry, which is why one mapping file holds both directions.
        method:
          type: string
          enum:
            - GET
            - POST
        path:
          type: string
          maxLength: 512
          pattern: ^/[A-Za-z0-9._~%/-]*$
          description: Appended to that participant's `baseUrl`. Any depth.
          example: /nwpapi/get-daily
        mappings:
          type: string
          maxLength: 256
          pattern: ^mappings/(?!.*\.\.)[a-z0-9][a-z0-9._/-]*\.(discover|select|init|confirm|status|track|cancel|update|rate|support)\.ya?ml$
          description: |-
            One file per binding-action, holding `request:` and `response:`. The filename's action
            segment must equal the `action` it sits under. The registry names this file; it does not
            fetch it.
          example: mappings/mausamgram/weather-observation.select.yaml
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 15000
        retryMax:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
          description: |-
            Retries happen before the caller sees a failure, so a caller waits out
            `timeoutMs` × `retryMax` before getting a NACK.
        status:
          allOf:
            - $ref: "#/components/schemas/Status"
          description: Per action, so retiring one action leaves the capability and the others untouched.
