name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than inherited: production defaults to noop (A5), and without
  # this the whole semantic path would go untested from the day semantic search
  # was deferred.
  EMBEDDING_PROVIDER: hashing
  MIN_COVERAGE: "80"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A glob, not a list: the service module has no dependencies yet, so
          # a literal go.sum path would fail to resolve and disable the cache.
          cache-dependency-path: "**/go.sum"
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A glob, not a list: the service module has no dependencies yet, so
          # a literal go.sum path would fail to resolve and disable the cache.
          cache-dependency-path: "**/go.sum"
      - run: make build
      - run: make test

      - name: Coverage
        run: |
          make cover
          go tool cover -func=coverage.out | tee coverage-func.txt
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -1 coverage-func.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "<!-- coverage-report -->"
            echo "### Test coverage (min ${MIN_COVERAGE}%)"
            echo '```'
            tail -1 coverage-func.txt
            echo '```'
          } > coverage-report.md

      - name: Find existing coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-coverage-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- coverage-report -->"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-coverage-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: coverage-report.md
          edit-mode: replace

      - name: Gate on minimum coverage
        run: |
          pct=$(tail -1 coverage-func.txt | grep -oE '[0-9]+\.[0-9]+%$' | tr -d '%')
          echo "coverage: ${pct}%, minimum: ${MIN_COVERAGE}%"
          awk -v pct="$pct" -v min="$MIN_COVERAGE" 'BEGIN { exit !(pct >= min) }' \
            || { echo "::error::coverage ${pct}% is below the ${MIN_COVERAGE}% minimum"; exit 1; }
