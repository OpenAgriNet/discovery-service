name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A glob, not a list: the service module has no dependencies yet, so
          # a literal go.sum path would fail to resolve and disable the cache.
          cache-dependency-path: "**/go.sum"

      # T4, half one: known vulnerabilities in the Go dependency graph.
      - name: govulncheck
        run: make security 2>&1 | tee govulncheck-report.txt

      - name: Assemble govulncheck PR comment
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "<!-- sec-scan:govulncheck -->"
            echo "### 🛡️ govulncheck — Go dependency vulnerabilities"
            echo "[View full run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            if grep -q '^Vulnerability #' govulncheck-report.txt; then
              echo "| Module | Installed | Fixed | Advisory |"
              echo "|---|---|---|---|"
              awk '
                /Module:/    { module = $2 }
                /Found in:/  { split($0, a, "@"); installed = a[2] }
                /Fixed in:/  { split($0, a, "@"); fixed = a[2] }
                /^Vulnerability #/ {
                  id = $3
                  next
                }
                /Fixed in:/ {
                  printf "| %s | %s | %s | [%s](https://pkg.go.dev/vuln/%s) |\n", module, installed, fixed, id, id
                }
              ' govulncheck-report.txt
            else
              echo "No known vulnerabilities found."
            fi
            echo
            echo "<details><summary>Full govulncheck output</summary>"
            echo
            echo '```'
            cat govulncheck-report.txt
            echo '```'
            echo "</details>"
          } > govulncheck-comment.md

      - name: Find existing govulncheck comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-govulncheck-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- sec-scan:govulncheck -->"

      - name: Comment govulncheck report on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-govulncheck-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: govulncheck-comment.md
          edit-mode: replace

      # Base images are dhi.io/*, a Docker Hardened Images registry gated on a
      # Docker subscription — anonymous pulls 401. Same login a local build
      # needs (see the Dockerfile's FROM comment), just non-interactive here.
      #
      # Accepts either credential shape: DHI_AUTH already holds the combined
      # base64 "user:token" blob docker login itself writes to config.json,
      # or DHI_USERNAME/DHI_PAT are two plain values to combine into one.
      # Either way it's config.json's own auth format, so it's written
      # directly rather than through docker/login-action, whose
      # username/password inputs don't accept a pre-combined blob.
      - name: Log in to dhi.io
        run: |
          if [ -n "${{ secrets.DHI_AUTH }}" ]; then
            AUTH="${{ secrets.DHI_AUTH }}"
          else
            AUTH=$(printf '%s:%s' "${{ secrets.DHI_USERNAME }}" "${{ secrets.DHI_PAT }}" | base64 -w0)
          fi
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {"auths":{"dhi.io":{"auth":"${AUTH}"}}}
          EOF

      # T4, half two: the shipped image. The scan is of the image and not of
      # go.sum so that the toolchain pinned in tools/go.mod — which is never
      # linked into the binary — cannot fail a release it does not ship in.
      - name: Build image
        run: docker build -t discovery-service:${{ github.sha }} .

      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: discovery-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-report.txt

      - name: Assemble Trivy PR comment
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "<!-- sec-scan:trivy-image -->"
            echo "### 🛡️ Trivy — image scan (HIGH,CRITICAL)"
            echo "[View full run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "<details><summary>Findings</summary>"
            echo
            echo '```'
            cat trivy-report.txt
            echo '```'
            echo "</details>"
          } > trivy-comment.md

      - name: Find existing Trivy comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-trivy-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- sec-scan:trivy-image -->"

      - name: Comment Trivy report on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-trivy-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-comment.md
          edit-mode: replace

      # Gate the PR on the same findings the comments above already showed.
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: discovery-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
