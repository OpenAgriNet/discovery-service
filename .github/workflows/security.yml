name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Findings are uploaded as SARIF for GitHub's own code scanning UI (Security
  # tab, diff annotations) AND posted as a PR comment — the SARIF path alone
  # took three clicks (check -> run -> results) to see a finding that used to
  # be one scroll away in the PR conversation. pull-requests: write is for
  # the comment; security-events: write is for the SARIF upload.
  pull-requests: write
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # T4, half one: the dependency graph as written. This catches what the
      # image scan structurally cannot — a vulnerable module that only the test
      # suite imports, so it is never linked into the binary and never appears
      # in a layer. The first real finding was exactly that shape:
      # github.com/moby/go-archive, pulled in by testcontainers.
      #
      # Logic lives in the Makefile's trivy-deps target — same command a local
      # `make trivy-deps` runs. Verified live against trivy v0.74.0: --severity
      # filters the SARIF output on its own now, so no separate
      # limit-severities-for-sarif post-filter is needed the way the old
      # trivy-action wrapper required.
      - name: Trivy dependency scan (report)
        run: make trivy-deps

      # A category per scan: without it the second upload replaces the first,
      # because GitHub keys an analysis on (ref, category).
      - name: Upload dependency findings
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

      # Posted right after the report, on every run — pass or fail, and
      # before the image is even built — so a PR shows the dependency finding
      # immediately rather than after the whole job finishes. Reads the same
      # SARIF just uploaded above; no second scan.
      #
      # Trivy's SARIF has no structured per-field severity/version columns;
      # each finding's detail lives as prose in message.text ("Package:
      # ...\nSeverity: ...\n..."), so the table columns below are pulled out
      # of that text rather than from dedicated JSON fields.
      # continue-on-error: this step's own jq bug is what took the whole job
      # down last run — capture(...)?.v is valid on jq 1.8 (what a workstation
      # has) but a syntax error on jq 1.7.1 (what this runner image ships),
      # so it never reached the image build at all. Fixed below with a `def`,
      # which sidesteps the postfix-`?`-then-field-access ambiguity outright,
      # but a report-formatting step must never be able to fail the job
      # regardless — the gate at the bottom is what decides that.
      - name: Assemble Trivy dependency PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          {
            echo "<!-- sec-scan:trivy-deps -->"
            echo "### 🛡️ Trivy — Go dependency scan (HIGH,CRITICAL)"
            echo "[View full run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            jq -r '
              def val(re; default): (capture(re) // {v: default}).v;
              [ .runs[].results[]? ] as $found
              | if ($found | length) == 0 then
                  "No HIGH or CRITICAL findings."
                else
                  "| Package | Severity | Installed | Fixed in | Advisory |",
                  "|---|---|---|---|---|",
                  ( $found[] | .ruleId as $id | (.message.text // "") as $m |
                    "| `" + ($m | val("Package: (?<v>[^\\n]+)"; "?")) + "` "
                    + "| " + ($m | val("Severity: (?<v>[^\\n]+)"; "?")) + " "
                    + "| " + ($m | val("Installed Version: (?<v>[^\\n]+)"; "?")) + " "
                    + "| " + ($m | val("Fixed Version: (?<v>[^\\n]+)"; "—")) + " "
                    + "| [" + $id + "](" + ($m | val("Link: \\[[^]]+\\]\\((?<v>[^)]+)\\)"; "")) + ") |"
                  )
                end
            ' trivy-deps.sarif
          } > trivy-deps-comment.md

      - name: Find existing Trivy dependency comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@v3
        id: find-trivy-deps-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- sec-scan:trivy-deps -->"

      # continue-on-error: a fork PR's default GITHUB_TOKEN is read-only, so
      # this 403s there even with pull-requests: write declared. The gate at
      # the bottom of this job is what actually decides pass/fail; a comment
      # that can't post must never fail the job over that.
      - name: Comment Trivy dependency report on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-trivy-deps-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-deps-comment.md
          edit-mode: replace

      # Base images are dhi.io/*, a Docker Hardened Images registry gated on a
      # Docker subscription — anonymous pulls 401. Same login a local build
      # needs (see the Dockerfile's FROM comment), just non-interactive here.
      #
      # Written directly to config.json rather than through docker/login-action,
      # whose username/password inputs don't accept a pre-combined blob — this
      # matches the format `docker login` itself writes.
      - name: Log in to dhi.io
        run: |
          AUTH=$(printf '%s:%s' "${{ secrets.DOCKERHUB_USERNAME }}" "${{ secrets.DOCKERHUB_TOKEN }}" | base64 -w0)
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {"auths":{"dhi.io":{"auth":"${AUTH}"}}}
          EOF

      # T4, half two: the shipped image, which is what the dependency scan
      # above cannot see. It reads the base layers, and it reads the Go build
      # info embedded in the binary — including `stdlib`, so a Go toolchain CVE
      # is reported here and nowhere else. Trivy does not derive stdlib from
      # go.mod's `go` directive: measured, a go.mod declaring `go 1.21.0`
      # reports zero findings, and the same vulnerabilities appear as `stdlib`
      # once the compiled binary is scanned.
      - name: Build image
        run: docker build -t discovery-service:${{ github.sha }} .

      - name: Trivy image scan (report)
        run: make trivy-image IMAGE=discovery-service:${{ github.sha }}

      - name: Upload image findings
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Assemble Trivy image PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          {
            echo "<!-- sec-scan:trivy-image -->"
            echo "### 🛡️ Trivy — image scan (HIGH,CRITICAL)"
            echo "[View full run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            jq -r '
              def val(re; default): (capture(re) // {v: default}).v;
              [ .runs[].results[]? ] as $found
              | if ($found | length) == 0 then
                  "No HIGH or CRITICAL findings."
                else
                  "| Package | Severity | Installed | Fixed in | Advisory |",
                  "|---|---|---|---|---|",
                  ( $found[] | .ruleId as $id | (.message.text // "") as $m |
                    "| `" + ($m | val("Package: (?<v>[^\\n]+)"; "?")) + "` "
                    + "| " + ($m | val("Severity: (?<v>[^\\n]+)"; "?")) + " "
                    + "| " + ($m | val("Installed Version: (?<v>[^\\n]+)"; "?")) + " "
                    + "| " + ($m | val("Fixed Version: (?<v>[^\\n]+)"; "—")) + " "
                    + "| [" + $id + "](" + ($m | val("Link: \\[[^]]+\\]\\((?<v>[^)]+)\\)"; "")) + ") |"
                  )
                end
            ' trivy-image.sarif
          } > trivy-image-comment.md

      - name: Find existing Trivy image comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@v3
        id: find-trivy-image-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- sec-scan:trivy-image -->"

      - name: Comment Trivy image report on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-trivy-image-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-image-comment.md
          edit-mode: replace

      # Gate on the reports already produced rather than scanning a third and
      # fourth time — logic lives in the Makefile's trivy-gate target so a
      # local `make trivy-gate` checks the exact same two files this job
      # just wrote. Last in the job, so a red build still leaves both reports
      # behind. limit-severities-for-sarif above is what makes counting
      # results equivalent to Trivy's own `--exit-code 1 --severity
      # HIGH,CRITICAL`.
      - name: Gate on HIGH or CRITICAL findings
        run: make trivy-gate
