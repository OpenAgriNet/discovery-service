name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Findings are uploaded as SARIF and rendered by GitHub's own code scanning
  # UI — the Security tab, plus annotations on the diff — rather than pasted
  # into a pull request comment this workflow has to format itself.
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # T4, half one: the dependency graph as written. This catches what the
      # image scan structurally cannot — a vulnerable module that only the test
      # suite imports, so it is never linked into the binary and never appears
      # in a layer. The first real finding was exactly that shape:
      # github.com/moby/go-archive, pulled in by testcontainers.
      #
      # skip-dirs excludes tools/ (a separate go.mod for build-time tooling,
      # e.g. golangci-lint) for the reason that module exists at all: the
      # linter's dependency graph is not the binary's, so it cannot fail a
      # release it does not ship in.
      #
      # limit-severities-for-sarif is what makes the SARIF obey `severity`.
      # Without it the report carries every severity Trivy knows and the
      # Security tab fills with LOW noise the gate below would never fail on.
      - name: Trivy dependency scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: tools
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"
          format: sarif
          output: trivy-deps.sarif

      # A category per scan: without it the second upload replaces the first,
      # because GitHub keys an analysis on (ref, category).
      - name: Upload dependency findings
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

      # Base images are dhi.io/*, a Docker Hardened Images registry gated on a
      # Docker subscription — anonymous pulls 401. Same login a local build
      # needs (see the Dockerfile's FROM comment), just non-interactive here.
      #
      # Accepts either credential shape: DHI_AUTH already holds the combined
      # base64 "user:token" blob docker login itself writes to config.json,
      # or DHI_USERNAME/DHI_PAT are two plain values to combine into one.
      # Either way it's config.json's own auth format, so it's written
      # directly rather than through docker/login-action, whose
      # username/password inputs don't accept a pre-combined blob.
      - name: Log in to dhi.io
        run: |
          if [ -n "${{ secrets.DHI_AUTH }}" ]; then
            AUTH="${{ secrets.DHI_AUTH }}"
          else
            AUTH=$(printf '%s:%s' "${{ secrets.DHI_USERNAME }}" "${{ secrets.DHI_PAT }}" | base64 -w0)
          fi
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {"auths":{"dhi.io":{"auth":"${AUTH}"}}}
          EOF

      # T4, half two: the shipped image, which is what the dependency scan
      # above cannot see. It reads the base layers, and it reads the Go build
      # info embedded in the binary — including `stdlib`, so a Go toolchain CVE
      # is reported here and nowhere else. Trivy does not derive stdlib from
      # go.mod's `go` directive: measured, a go.mod declaring `go 1.21.0`
      # reports zero findings, and the same vulnerabilities appear as `stdlib`
      # once the compiled binary is scanned.
      - name: Build image
        run: docker build -t discovery-service:${{ github.sha }} .

      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: discovery-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif

      - name: Upload image findings
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Gate on the reports already produced rather than scanning a third and
      # fourth time. Two independent scans of the same thing can disagree —
      # Trivy refreshes its database on each run — so a gate that rescans can
      # fail on a finding that is in no uploaded report, which is the one state
      # nobody can act on. Reading the SARIF makes the gate and the Security
      # tab the same answer by construction.
      #
      # Last in the job, so a red build still leaves both reports behind.
      # limit-severities-for-sarif above is what makes counting results
      # equivalent to Trivy's own `--exit-code 1 --severity HIGH,CRITICAL`.
      - name: Gate on HIGH or CRITICAL findings
        run: |
          fail=0
          for report in trivy-deps.sarif trivy-image.sarif; do
            count=$(jq '[.runs[].results[]?] | length' "$report")
            echo "${report}: ${count} HIGH/CRITICAL"
            if [ "$count" -gt 0 ]; then
              jq -r '.runs[].results[]? | "::error::\(.ruleId) \(.message.text)"' "$report"
              fail=1
            fi
          done
          exit "$fail"
