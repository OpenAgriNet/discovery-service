name: Build and Push

# Annotated tags only, per OAN convention: v{SemVer} (e.g. v0.0.1).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Base images are dhi.io/*, a Docker Hardened Images registry gated on a
      # Docker subscription — anonymous pulls 401.
      - name: Log in to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PAT }}

      # GITHUB_TOKEN can be denied write_package when creating a brand-new
      # package under a personal (non-org) namespace, even with this
      # workflow's `packages: write` and the repo's default token permissions
      # both set to write — a documented GHCR quirk. GHCR_PAT (classic PAT,
      # write:packages) is the standard workaround; falls back to
      # GITHUB_TOKEN when no such secret is set, which is enough once the
      # package exists or for an org-owned repo.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # GHCR image refs must be lowercase; github.repository_owner preserves
      # the owner's real case (OpenAgriNet), so it can't be used as-is. This
      # resolves to whichever account or org owns the repo the tag was pushed
      # to — a fork pushes under the fork owner, no per-person edit needed.
      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Each arch is a separate tag here; the manifest job below stitches
      # amd64 and arm64 into the single tag users actually pull.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ env.OWNER }}/discovery-service:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # imagetools create makes one manifest list from the two arch-specific
      # images the build job just pushed — this is what lets `docker pull`
      # resolve the right arch automatically on either amd64 or arm64.
      - name: Create multi-arch manifest
        run: |
          BASE="ghcr.io/${{ env.OWNER }}/discovery-service"
          docker buildx imagetools create \
            -t "${BASE}:${{ github.ref_name }}" \
            -t "${BASE}:latest" \
            "${BASE}:${{ github.ref_name }}-amd64" \
            "${BASE}:${{ github.ref_name }}-arm64"
