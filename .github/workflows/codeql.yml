name: CodeQL

# A different question from security.yml, which is why it is a different file.
# Trivy and govulncheck both ask "does this depend on something with a
# published CVE". CodeQL asks whether the code in this repo has a vulnerability
# in it — injection, traversal, request forgery, a secret reaching a log.
# Nothing here asked that before.
#
# Concretely, it is how three of CLAUDE.md's standing rules stop being held by
# review alone:
#
#   "SQL is always parameterised"          -> go/sql-injection
#   "a URL from a request body is not      -> go/request-forgery
#    trusted"
#   "secrets never touch a log field"      -> go/clear-text-logging,
#                                             go/hardcoded-credentials
#
# No pull_request trigger here — ci.yml's security-scan job runs this same
# analyze step, on the same category, as part of a PR's one Security Scan
# check, so a PR gets a live CodeQL pass without a second job-level check for
# it. This file exists so that pass has something to compare against: a
# pull_request analysis reads as "new alerts" only relative to the base
# branch's most recent analysis, and this is what keeps that baseline current
# on every push to the trunk. The weekly schedule additionally re-runs the
# same code through query packs that update independently of any commit here
# — the one kind of finding a push trigger can never produce on its own.
#
# Separate from security.yml rather than a job inside it because triggers are
# per-workflow: putting this in security.yml would fire the Trivy and
# govulncheck job on every trunk push CodeQL runs on too — same problem
# ci.yml's security-scan job solves for the PR side, just on the trunk side.
on:
  push:
    # release-* as a glob, not release-0.0.1 by name: the next release branch
    # is the exact moment nobody remembers a workflow names the old one, and
    # the symptom is silent — no failure, just a branch that stopped being
    # analysed. The glob is why this file needs no edit at 0.0.2.
    branches: [main, release-*]
  schedule:
    # Monday 04:17 UTC — an hour after security.yml's, not the same minute, so
    # the two are not queued against each other. Weekly because the queries
    # themselves change: the same code re-analysed six months later is a
    # genuinely different scan, which is the one thing a push trigger can never
    # do.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          # manual, not autobuild: autobuild guesses at how to build a Go
          # module, and this one is built one way — `make build`, over every
          # package, with the ldflags that stamp buildinfo. A CodeQL database
          # extracted from a build nobody else performs describes a program
          # nobody else runs.
          build-mode: manual
          # security-extended, not the default suite. The default returned zero
          # on this tree, which is the only condition under which widening is
          # cheap: there is no backlog for the extra queries to be lost in, so
          # anything this surfaces is both new and attributable. It adds the
          # lower-confidence and the harder-to-exploit queries — the ones worth
          # reading rather than the ones worth blocking on, which is why this
          # job still does not fail on findings.
          queries: security-extended

      - run: make build

      # An explicit category so this analysis sits beside trivy-deps and
      # trivy-image in the Security tab rather than competing with them for the
      # default one.
      #
      # Findings do NOT fail this job: analyze files alerts and exits 0. The
      # check therefore says whether CodeQL ran and the Security tab says what
      # it found. Gating on the alert count is a deliberate later decision,
      # taken once there is a baseline to gate against.
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-go
