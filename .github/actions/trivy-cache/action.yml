name: Cache Trivy
description: >
  Restores the pinned trivy binary and its vulnerability DB from the Actions
  cache. Every job that scans needs this, so it lives here rather than being
  pasted into each one — the workflows this replaced carried three copies of
  it. The trivy-action this replaced cached both for us;
  `make trivy-deps`/`trivy-image` alone re-download the binary (~30MB) and the
  DB (~100MB+) on every run.

runs:
  using: composite
  steps:
    # Keyed on the Makefile's own hash so a TRIVY_VERSION bump there busts the
    # cache automatically, plus a daily date so the DB itself never goes stale
    # for longer than a day. runner.arch is in the key because the release
    # binary is arch-specific and the tag jobs run on both amd64 and arm64 —
    # without it one arch would restore the other's binary.
    - id: date
      shell: bash
      run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: |
          bin/trivy
          ~/.cache/trivy
        key: trivy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}-${{ steps.date.outputs.today }}
        restore-keys: |
          trivy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}-
